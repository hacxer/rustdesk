name: 9394 armv7 - SUNMI T2 Android 7.1
on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Upstream tag or SHA
        default: '1.5.0'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: custom-9394-armv7
  cancel-in-progress: false
env:
  RUST_VERSION: '1.75.0'
  CARGO_BUILD_JOBS: '3'
jobs:
  armv7:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Checkout explicit upstream
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: rustdesk/rustdesk
          ref: ${{ inputs.upstream_ref }}
          path: upstream
          submodules: recursive
          persist-credentials: false
      - name: Preflight original signing key and preset password
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RUSTDESK_PRESET_PASSWORD: ${{ secrets.RUSTDESK_PRESET_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD RUSTDESK_PRESET_PASSWORD; do
            if [ -z "$(printenv "$name")" ]; then echo "::error::Required secret missing: $name"; exit 1; fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rustdesk-9394.keystore"
          printf '%s  %s\n' d88572222dbe472b4b191bd9734859e27bcd115f06a2b711eec193b4c29d0d91 "$RUNNER_TEMP/rustdesk-9394.keystore" | sha256sum -c -
          keytool -list -keystore "$RUNNER_TEMP/rustdesk-9394.keystore" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS"
      - name: Prepare reviewed source
        run: |
          python3 -m py_compile scripts/custom-9394/prepare.py scripts/custom-9394/verify.py
          python3 scripts/custom-9394/prepare.py upstream
          git -C upstream diff --check
          mkdir -p dist
          python3 scripts/custom-9394/verify.py manifest
      - name: Install remote prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake curl gcc-multilib g++-multilib libclang-dev libgtk-3-dev libasound2-dev libpulse-dev libxdo-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxfixes-dev libva-dev libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev llvm-dev nasm ninja-build pkg-config openjdk-17-jdk-headless
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
          targets: armv7-linux-androideabi
      - name: Validate locked dependencies
        working-directory: upstream
        run: |
          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/cargo-metadata.json"
          rustfmt --edition 2021 src/custom_9394.rs
      - name: Test legacy audit acknowledgment
        run: |
          mkdir -p "$RUNNER_TEMP/9394-audit-check/src"
          cp scripts/custom-9394/source/audit_ack_9394.rs "$RUNNER_TEMP/9394-audit-check/src/lib.rs"
          cp upstream/Cargo.lock "$RUNNER_TEMP/9394-audit-check/Cargo.lock"
          cat > "$RUNNER_TEMP/9394-audit-check/Cargo.toml" <<'EOF'
          [package]
          name = "custom-9394-audit-check"
          version = "0.1.0"
          edition = "2021"
          [dependencies]
          serde_json = "=1.0.118"
          EOF
          cargo test --manifest-path "$RUNNER_TEMP/9394-audit-check/Cargo.toml"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: upstream -> target
          prefix-key: custom9394-armv7-rust175
          cache-on-failure: true
      - name: Flutter for bridge generation
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.22.3'
          cache: true
      - name: Generate upstream bridge
        working-directory: upstream
        run: |
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked
          cp flutter/pubspec.yaml "$RUNNER_TEMP/pubspec.yaml"
          sed -i 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          (cd flutter && flutter pub get)
          flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp "$RUNNER_TEMP/pubspec.yaml" flutter/pubspec.yaml
      - name: Flutter for Android
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.24.5'
          cache: true
      - name: Analyze Android startup
        working-directory: upstream
        run: |
          FLUTTER_ROOT=$(dirname "$(dirname "$(command -v flutter)")")
          git -C "$FLUTTER_ROOT" apply "$GITHUB_WORKSPACE/upstream/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"
          cd flutter
          flutter pub get
          dart format lib/mobile/bootstrap_9394.dart
          flutter analyze --no-pub lib/mobile/bootstrap_9394.dart lib/models/server_model.dart lib/mobile/pages/server_page.dart
      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779
        id: ndk
        with:
          ndk-version: r28c
          add-to-path: true
      - name: Set NDK paths
        run: |
          echo 'ANDROID_NDK_HOME=${{ steps.ndk.outputs.ndk-path }}' >> "$GITHUB_ENV"
          echo 'ANDROID_NDK_ROOT=${{ steps.ndk.outputs.ndk-path }}' >> "$GITHUB_ENV"
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false
      - name: Build armv7 native dependencies
        working-directory: upstream
        run: bash flutter/build_android_deps.sh armeabi-v7a
      - name: Build armv7 Rust library
        working-directory: upstream
        env:
          RUSTDESK_PRESET_PASSWORD: ${{ secrets.RUSTDESK_PRESET_PASSWORD }}
        run: |
          cargo install cargo-ndk --version 3.1.2 --locked
          bash flutter/ndk_arm.sh
          mkdir -p flutter/android/app/src/main/jniLibs/armeabi-v7a
          cp target/armv7-linux-androideabi/release/liblibrustdesk.so flutter/android/app/src/main/jniLibs/armeabi-v7a/librustdesk.so
          cp "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/libc++_shared.so" flutter/android/app/src/main/jniLibs/armeabi-v7a/
      - name: Build 32-bit APK
        working-directory: upstream/flutter
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          export PATH="$JAVA_HOME/bin:$PATH"
          sed -i 's/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/' android/gradle.properties
          flutter build apk --release --target-platform android-arm --split-per-abi --build-name "$BUILD_NAME" --build-number "$((15010000 + GITHUB_RUN_NUMBER))"
      - name: Preserve unverified build checkpoint
        run: |
          mkdir -p checkpoint
          cp upstream/flutter/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk checkpoint/unverified-armv7.apk
          cp dist/build-manifest.json upstream/custom-9394-changes.json checkpoint/
      - name: Upload unverified checkpoint for CI diagnosis only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: armv7-unverified-checkpoint-${{ github.run_id }}
          path: checkpoint/
          retention-days: 7
      - name: Sign V1 and V2 with original certificate
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/zipalign" -f -p 4 upstream/flutter/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/rustdesk-9394.keystore" --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD --v1-signing-enabled true --v2-signing-enabled true --out dist/armv7-signed.apk "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs dist/armv7-signed.apk | tee dist/signature-verification.txt
          grep -Fq 'Verified using v1 scheme (JAR signing): true' dist/signature-verification.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' dist/signature-verification.txt
          "$BUILD_TOOLS/zipalign" -c -p 4 dist/armv7-signed.apk
          curl --fail --location --retry 3 'https://github.com/hacxer/rustdesk/releases/download/v1.4.9-custom-9394/rustdesk-1.4.9-aarch64-signed-9394.apk' --output "$RUNNER_TEMP/previous.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/previous.apk" 2>&1 | tee "$RUNNER_TEMP/previous-cert.txt"
          cp "$RUNNER_TEMP/previous-cert.txt" dist/previous-cert.txt
          "$BUILD_TOOLS/aapt" dump badging dist/armv7-signed.apk 2>&1 | tee dist/apk-badging.txt
          python3 scripts/custom-9394/verify.py apk
          echo '### Signed armv7 verified; SUNMI T2 device validation PENDING' >> "$GITHUB_STEP_SUMMARY"
          cat dist/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: armv7-signed-9394-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Upload non-secret diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: armv7-diagnostics-${{ github.run_number }}
          path: |
            dist/build-manifest.json
            dist/*.txt
            upstream/custom-9394-changes.json
          if-no-files-found: ignore
      - name: Remove temporary signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/rustdesk-9394.keystore" "$RUNNER_TEMP/previous.apk" "$RUNNER_TEMP/aligned.apk"
