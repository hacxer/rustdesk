      - name: Build rustdesk lib
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          ./flutter/ndk_arm64.sh
          mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a
          cp ./target/aarch64-linux-android/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so

      - name: Verify defaults embedded in Android native library
        shell: bash
        run: |
          set -euo pipefail
          so=target/aarch64-linux-android/release/liblibrustdesk.so
          test -s "$so"
          strings "$so" > "$RUNNER_TEMP/librustdesk.strings"
          for needle in             'rustdesk.9394.cn'             'http://rustdesk.9394.cn:21114'             '6SM+NeAH25BBbI3wLINUrc56GJsImMLWvRTIsQL6fYQ='             'allow-numeric-one-time-password'             'direct-server'; do
            grep -Fq "$needle" "$RUNNER_TEMP/librustdesk.strings"
          done
          echo 'Android native defaults verified'

      - name: Build rustdesk apk (unsigned)
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
          mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a
          cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/
          cp ./target/aarch64-linux-android/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so
          pushd flutter
          flutter build apk --release             --target-platform android-arm64             --split-per-abi             --build-name 1.4.9.9394             --build-number 14909394
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../rustdesk-1.4.9-aarch64-unsigned.apk
          popd
          mkdir -p signed-apk
          mv rustdesk-1.4.9-aarch64-unsigned.apk signed-apk/

      - name: Restore fixed Android signing key
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/rustdesk-9394.keystore"
          echo 'd88572222dbe472b4b191bd9734859e27bcd115f06a2b711eec193b4c29d0d91  rustdesk-9394.keystore' | sha256sum -c -
          "$JAVA_HOME/bin/keytool" -list             -keystore "$GITHUB_WORKSPACE/rustdesk-9394.keystore"             -storepass "$ANDROID_KEYSTORE_PASSWORD"             -alias "$ANDROID_KEY_ALIAS"

      - name: Sign APK with fixed key
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_TOOLS=$(find /usr/local/lib/android/sdk/build-tools -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/zipalign" -f -p 4             signed-apk/rustdesk-1.4.9-aarch64-unsigned.apk             signed-apk/rustdesk-1.4.9-aarch64-aligned.apk
          "$BUILD_TOOLS/apksigner" sign             --ks "$GITHUB_WORKSPACE/rustdesk-9394.keystore"             --ks-key-alias "$ANDROID_KEY_ALIAS"             --ks-pass env:ANDROID_KEYSTORE_PASSWORD             --key-pass env:ANDROID_KEY_PASSWORD             --out signed-apk/rustdesk-1.4.9-aarch64-signed-9394.apk             signed-apk/rustdesk-1.4.9-aarch64-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs             signed-apk/rustdesk-1.4.9-aarch64-signed-9394.apk

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rustdesk-1.4.9-aarch64-signed-9394
          path: signed-apk/rustdesk-1.4.9-aarch64-signed-9394.apk

