name: 9394 append verified extra platforms
on:
  workflow_dispatch:
    inputs:
      android_run:
        description: Verified Android ARM64 source run
        required: true
        default: '39279619028'
        type: string
      windows_run:
        description: Verified Windows x64 source run
        required: true
        default: '39281643811'
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: custom-9394-append-formal-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: verified-extra-aarch64-${{ inputs.android_run }}
          run-id: ${{ inputs.android_run }}
          github-token: ${{ github.token }}
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: verified-extra-windows-${{ inputs.windows_run }}
          run-id: ${{ inputs.windows_run }}
          github-token: ${{ github.token }}
          path: dist/
      - name: Verify original binaries and append release assets
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_SOURCE_RUN: ${{ inputs.android_run }}
          WINDOWS_SOURCE_RUN: ${{ inputs.windows_run }}
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/custom-9394/publish-extra.py
          find dist -maxdepth 1 -type f -printf '%f\n' | sort
          python3 scripts/custom-9394/publish-extra.py
